<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shadow</title>

    <style>
      .box {
        width: 200px;
        height: 300px;
        margin: 0 auto;
        /* border: 3px solid green; */
        box-shadow:
          inset 0 0 10px 5px gray,
          0 0 10px 5px red,
          0 0 100px 5px green;
        text-shadow: 2px 2px 2px rgba(0, 0, 0, 1);
      }
    </style>
  </head>
  <body style="display: flex">
    <div class="box">HELLO</div>
    <div class="box" style="position: relative; top: 30px; right: 200px"></div>

    <div style="height: 2000px"></div>
  </body>
</html>
